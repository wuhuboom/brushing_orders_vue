<svg width="240" height="100" viewBox="0 0 240 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- AI ORCHESTRATION — Many → One -->
  <!-- Animation: Input nodes appear sequentially, lines draw toward convergence node, node pulses, output signal draws, gold pulses appear -->

  <!-- Four input nodes — appear with staggered fade-in and prominent breathe -->
  <circle cx="16" cy="16" r="6" fill="#6B7B8D" opacity="0" stroke="#6B7B8D" stroke-width="1" stroke-opacity="0.12">
    <animate attributeName="opacity" values="0;0.18" dur="0.4s" fill="freeze" begin="0.2s"/>
    <animate attributeName="r" values="6;7.5;6" dur="3.5s" repeatCount="indefinite" begin="0.6s"/>
  </circle>
  <circle cx="16" cy="38" r="6" fill="#6B7B8D" opacity="0" stroke="#6B7B8D" stroke-width="1" stroke-opacity="0.12">
    <animate attributeName="opacity" values="0;0.18" dur="0.4s" fill="freeze" begin="0.4s"/>
    <animate attributeName="r" values="6;7.5;6" dur="3.8s" repeatCount="indefinite" begin="0.8s"/>
  </circle>
  <circle cx="16" cy="60" r="6" fill="#6B7B8D" opacity="0" stroke="#6B7B8D" stroke-width="1" stroke-opacity="0.12">
    <animate attributeName="opacity" values="0;0.18" dur="0.4s" fill="freeze" begin="0.6s"/>
    <animate attributeName="r" values="6;7.5;6" dur="4.1s" repeatCount="indefinite" begin="1.0s"/>
  </circle>
  <circle cx="16" cy="82" r="6" fill="#6B7B8D" opacity="0" stroke="#6B7B8D" stroke-width="1" stroke-opacity="0.12">
    <animate attributeName="opacity" values="0;0.18" dur="0.4s" fill="freeze" begin="0.8s"/>
    <animate attributeName="r" values="6;7.5;6" dur="3.3s" repeatCount="indefinite" begin="1.2s"/>
  </circle>

  <!-- Convergence lines — draw toward center node -->
  <line x1="22" y1="16" x2="52" y2="42" stroke="#6B7B8D" stroke-width="1" opacity="0" stroke-dasharray="40" stroke-dashoffset="40">
    <animate attributeName="stroke-dashoffset" values="40;0" dur="0.6s" fill="freeze" begin="0.5s"/>
    <animate attributeName="opacity" values="0;0.15" dur="0.4s" fill="freeze" begin="0.5s"/>
  </line>
  <line x1="22" y1="38" x2="52" y2="46" stroke="#6B7B8D" stroke-width="1" opacity="0" stroke-dasharray="35" stroke-dashoffset="35">
    <animate attributeName="stroke-dashoffset" values="35;0" dur="0.6s" fill="freeze" begin="0.7s"/>
    <animate attributeName="opacity" values="0;0.15" dur="0.4s" fill="freeze" begin="0.7s"/>
  </line>
  <line x1="22" y1="60" x2="52" y2="52" stroke="#6B7B8D" stroke-width="1" opacity="0" stroke-dasharray="35" stroke-dashoffset="35">
    <animate attributeName="stroke-dashoffset" values="35;0" dur="0.6s" fill="freeze" begin="0.9s"/>
    <animate attributeName="opacity" values="0;0.15" dur="0.4s" fill="freeze" begin="0.9s"/>
  </line>
  <line x1="22" y1="82" x2="52" y2="56" stroke="#6B7B8D" stroke-width="1" opacity="0" stroke-dasharray="42" stroke-dashoffset="42">
    <animate attributeName="stroke-dashoffset" values="42;0" dur="0.6s" fill="freeze" begin="1.1s"/>
    <animate attributeName="opacity" values="0;0.15" dur="0.4s" fill="freeze" begin="1.1s"/>
  </line>

  <!-- Convergence node — outer ring with prominent pulse -->
  <circle cx="64" cy="49" r="14" fill="#F5F2EB" stroke="#1E3328" stroke-width="1.8" opacity="0">
    <animate attributeName="opacity" values="0;0.55" dur="0.5s" fill="freeze" begin="1.4s"/>
    <animate attributeName="r" values="14;16;14" dur="3s" repeatCount="indefinite" begin="1.9s"/>
  </circle>
  <!-- Inner gold with dramatic pulse -->
  <circle cx="64" cy="49" r="5.5" fill="#D4A853" opacity="0">
    <animate attributeName="opacity" values="0;0.5" dur="0.4s" fill="freeze" begin="1.7s"/>
    <animate attributeName="r" values="5.5;7.5;5.5" dur="2.5s" repeatCount="indefinite" begin="2.1s"/>
    <animate attributeName="opacity" values="0.5;0.25;0.5" dur="2.5s" repeatCount="indefinite" begin="2.1s"/>
  </circle>

  <!-- Warm corridor behind output signal -->
  <rect x="84" y="34" width="148" height="30" rx="6" fill="#C67C5A" opacity="0">
    <animate attributeName="opacity" values="0;0.04" dur="0.8s" fill="freeze" begin="2s"/>
  </rect>

  <!-- Output signal line — draws from convergence node rightward -->
  <path d="M78,49 Q100,49 118,46 Q130,40 140,32 Q146,24 152,16 Q158,28 164,40 Q170,46 188,48 Q204,49 216,46 Q222,40 228,34" stroke="#1E3328" stroke-width="2.5" opacity="0" stroke-dasharray="220" stroke-dashoffset="220">
    <animate attributeName="stroke-dashoffset" values="220;0" dur="1.8s" fill="freeze" begin="2s"/>
    <animate attributeName="opacity" values="0;0.45" dur="0.6s" fill="freeze" begin="2s"/>
  </path>

  <!-- Gold pulse at signal peak — dramatic -->
  <circle cx="152" cy="16" r="4.5" fill="#D4A853" opacity="0">
    <animate attributeName="opacity" values="0;0.7" dur="0.3s" fill="freeze" begin="2.8s"/>
    <animate attributeName="r" values="4.5;7;4.5" dur="2s" repeatCount="indefinite" begin="3.1s"/>
    <animate attributeName="opacity" values="0.7;0.35;0.7" dur="2s" repeatCount="indefinite" begin="3.1s"/>
  </circle>

  <!-- Gold pulse at signal end — dramatic -->
  <circle cx="228" cy="34" r="3.5" fill="#D4A853" opacity="0">
    <animate attributeName="opacity" values="0;0.5" dur="0.3s" fill="freeze" begin="3.5s"/>
    <animate attributeName="r" values="3.5;5.5;3.5" dur="2.2s" repeatCount="indefinite" begin="3.8s"/>
    <animate attributeName="opacity" values="0.5;0.25;0.5" dur="2.2s" repeatCount="indefinite" begin="3.8s"/>
  </circle>
</svg>
