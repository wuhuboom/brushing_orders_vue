<svg width="240" height="100" viewBox="0 0 240 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- RETENTION — Thin → Thick -->
  <!-- Animation: Columns grow upward sequentially left to right, layers fade in bottom-up, gold pulses appear at tops -->

  <!-- Baseline -->
  <line x1="16" y1="88" x2="224" y2="88" stroke="#E8DFD6" stroke-width="0.8"/>

  <!-- Column 1 (thinnest) — grows in first -->
  <rect x="20" y="78" width="28" height="8" rx="2" fill="#C67C5A" opacity="0">
    <animate attributeName="opacity" values="0;0.08" dur="0.5s" fill="freeze" begin="0.3s"/>
  </rect>
  <rect x="20" y="72" width="28" height="4" rx="2" fill="#6B7B8D" opacity="0">
    <animate attributeName="opacity" values="0;0.1" dur="0.4s" fill="freeze" begin="0.5s"/>
  </rect>
  <rect x="20" y="64" width="28" height="4" rx="2" fill="#6B7B8D" opacity="0">
    <animate attributeName="opacity" values="0;0.08" dur="0.4s" fill="freeze" begin="0.7s"/>
  </rect>

  <!-- Column 2 -->
  <rect x="60" y="82" width="28" height="4" rx="2" fill="#C67C5A" opacity="0">
    <animate attributeName="opacity" values="0;0.06" dur="0.5s" fill="freeze" begin="0.6s"/>
  </rect>
  <rect x="60" y="70" width="28" height="10" rx="2" fill="#C67C5A" opacity="0">
    <animate attributeName="opacity" values="0;0.12" dur="0.5s" fill="freeze" begin="0.8s"/>
  </rect>
  <rect x="60" y="62" width="28" height="5" rx="2" fill="#6B7B8D" opacity="0">
    <animate attributeName="opacity" values="0;0.12" dur="0.4s" fill="freeze" begin="1.0s"/>
  </rect>
  <rect x="60" y="52" width="28" height="6" rx="2" fill="#6B7B8D" opacity="0">
    <animate attributeName="opacity" values="0;0.1" dur="0.4s" fill="freeze" begin="1.2s"/>
  </rect>
  <circle cx="74" cy="52" r="2" fill="#D4A853" opacity="0">
    <animate attributeName="opacity" values="0;0.25" dur="0.3s" fill="freeze" begin="1.4s"/>
  </circle>

  <!-- Column 3 -->
  <rect x="100" y="76" width="28" height="8" rx="2" fill="#C67C5A" opacity="0">
    <animate attributeName="opacity" values="0;0.1" dur="0.5s" fill="freeze" begin="0.9s"/>
  </rect>
  <rect x="100" y="60" width="28" height="14" rx="2" fill="#C67C5A" opacity="0">
    <animate attributeName="opacity" values="0;0.18" dur="0.5s" fill="freeze" begin="1.1s"/>
  </rect>
  <rect x="100" y="50" width="28" height="7" rx="2" fill="#6B7B8D" opacity="0">
    <animate attributeName="opacity" values="0;0.12" dur="0.4s" fill="freeze" begin="1.3s"/>
  </rect>
  <rect x="100" y="38" width="28" height="8" rx="2" fill="#6B7B8D" opacity="0">
    <animate attributeName="opacity" values="0;0.1" dur="0.4s" fill="freeze" begin="1.5s"/>
  </rect>
  <circle cx="114" cy="38" r="2.5" fill="#D4A853" opacity="0">
    <animate attributeName="opacity" values="0;0.35" dur="0.3s" fill="freeze" begin="1.7s"/>
  </circle>

  <!-- Column 4 -->
  <rect x="140" y="68" width="28" height="14" rx="2" fill="#C67C5A" opacity="0">
    <animate attributeName="opacity" values="0;0.15" dur="0.5s" fill="freeze" begin="1.2s"/>
  </rect>
  <rect x="140" y="48" width="28" height="18" rx="2" fill="#C67C5A" opacity="0">
    <animate attributeName="opacity" values="0;0.25" dur="0.5s" fill="freeze" begin="1.4s"/>
  </rect>
  <rect x="140" y="36" width="28" height="9" rx="2" fill="#6B7B8D" opacity="0">
    <animate attributeName="opacity" values="0;0.12" dur="0.4s" fill="freeze" begin="1.6s"/>
  </rect>
  <rect x="140" y="22" width="28" height="10" rx="2" fill="#1E3328" opacity="0">
    <animate attributeName="opacity" values="0;0.08" dur="0.4s" fill="freeze" begin="1.8s"/>
  </rect>
  <circle cx="154" cy="22" r="3" fill="#D4A853" opacity="0">
    <animate attributeName="opacity" values="0;0.5" dur="0.3s" fill="freeze" begin="2.0s"/>
    <animate attributeName="r" values="3;5;3" dur="2.5s" repeatCount="indefinite" begin="2.3s"/>
    <animate attributeName="opacity" values="0.5;0.25;0.5" dur="2.5s" repeatCount="indefinite" begin="2.3s"/>
  </circle>

  <!-- Column 5 (tallest, richest) -->
  <rect x="180" y="80" width="32" height="6" rx="2" fill="#C67C5A" opacity="0">
    <animate attributeName="opacity" values="0;0.1" dur="0.5s" fill="freeze" begin="1.5s"/>
  </rect>
  <rect x="180" y="60" width="32" height="18" rx="2" fill="#C67C5A" opacity="0">
    <animate attributeName="opacity" values="0;0.2" dur="0.5s" fill="freeze" begin="1.7s"/>
  </rect>
  <rect x="180" y="36" width="32" height="22" rx="2" fill="#C67C5A" opacity="0">
    <animate attributeName="opacity" values="0;0.35" dur="0.5s" fill="freeze" begin="1.9s"/>
  </rect>
  <rect x="180" y="22" width="32" height="12" rx="2" fill="#1E3328" opacity="0">
    <animate attributeName="opacity" values="0;0.1" dur="0.4s" fill="freeze" begin="2.1s"/>
  </rect>
  <rect x="180" y="8" width="32" height="10" rx="2" fill="#1E3328" opacity="0">
    <animate attributeName="opacity" values="0;0.12" dur="0.4s" fill="freeze" begin="2.3s"/>
  </rect>
  <!-- Crown gold pulse — dramatic breathing -->
  <circle cx="196" cy="8" r="4" fill="#D4A853" opacity="0">
    <animate attributeName="opacity" values="0;0.7" dur="0.4s" fill="freeze" begin="2.5s"/>
    <animate attributeName="r" values="4;6;4" dur="2s" repeatCount="indefinite" begin="2.9s"/>
    <animate attributeName="opacity" values="0.7;0.35;0.7" dur="2s" repeatCount="indefinite" begin="2.9s"/>
  </circle>
  <!-- Crown glow ring — wide pulsing -->
  <circle cx="196" cy="8" r="7" fill="none" stroke="#D4A853" stroke-width="0.6" opacity="0">
    <animate attributeName="opacity" values="0;0.3;0" dur="2.5s" repeatCount="indefinite" begin="2.9s"/>
    <animate attributeName="r" values="7;15;7" dur="2.5s" repeatCount="indefinite" begin="2.9s"/>
  </circle>
</svg>
