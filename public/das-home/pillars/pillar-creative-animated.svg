<svg width="240" height="100" viewBox="0 0 240 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- CREATIVE — Scatter → Focus -->
  <!-- Animation: Left blurry shapes drift and shimmer, right card fades in crisply, signal line draws, gold pulses -->

  <!-- LEFT: Blurry/unfocused state — more dramatic floating drift -->
  <rect x="8" y="10" width="32" height="20" rx="4" fill="#6B7B8D" opacity="0.06">
    <animateTransform attributeName="transform" type="translate" values="0,0;3,1.5;0,0" dur="5s" repeatCount="indefinite"/>
  </rect>
  <rect x="18" y="22" width="28" height="18" rx="4" fill="#6B7B8D" opacity="0.07">
    <animateTransform attributeName="transform" type="translate" values="0,0;-2,2.5;0,0" dur="4.5s" repeatCount="indefinite"/>
  </rect>
  <rect x="4" y="34" width="36" height="16" rx="4" fill="#6B7B8D" opacity="0.05">
    <animateTransform attributeName="transform" type="translate" values="0,0;3.5,-1.2;0,0" dur="5.5s" repeatCount="indefinite"/>
  </rect>
  <rect x="22" y="8" width="24" height="24" rx="4" fill="#6B7B8D" opacity="0.06">
    <animateTransform attributeName="transform" type="translate" values="0,0;-1.6,2;0,0" dur="4.8s" repeatCount="indefinite"/>
  </rect>
  <rect x="10" y="44" width="30" height="14" rx="4" fill="#6B7B8D" opacity="0.07">
    <animateTransform attributeName="transform" type="translate" values="0,0;2.5,-2;0,0" dur="5.2s" repeatCount="indefinite"/>
  </rect>
  <rect x="16" y="54" width="26" height="16" rx="4" fill="#6B7B8D" opacity="0.05">
    <animateTransform attributeName="transform" type="translate" values="0,0;-3,1;0,0" dur="4.3s" repeatCount="indefinite"/>
  </rect>
  <circle cx="20" cy="22" r="8" fill="#6B7B8D" opacity="0.06">
    <animateTransform attributeName="transform" type="translate" values="0,0;1.6,3;0,0" dur="5.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="36" cy="38" r="10" fill="#6B7B8D" opacity="0.05">
    <animateTransform attributeName="transform" type="translate" values="0,0;-2.5,-1.6;0,0" dur="4.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="14" cy="52" r="7" fill="#6B7B8D" opacity="0.07">
    <animateTransform attributeName="transform" type="translate" values="0,0;2,-2.5;0,0" dur="5.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="40" cy="18" r="6" fill="#6B7B8D" opacity="0.06">
    <animateTransform attributeName="transform" type="translate" values="0,0;-1.2,3.5;0,0" dur="4.9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="28" cy="60" r="9" fill="#6B7B8D" opacity="0.05">
    <animateTransform attributeName="transform" type="translate" values="0,0;3,0.6;0,0" dur="5.1s" repeatCount="indefinite"/>
  </circle>
  <!-- Faint horizontal scan lines — wider breathing -->
  <line x1="6" y1="16" x2="46" y2="16" stroke="#6B7B8D" stroke-width="1.5" opacity="0.06">
    <animate attributeName="opacity" values="0.06;0.01;0.06" dur="3s" repeatCount="indefinite"/>
  </line>
  <line x1="10" y1="30" x2="42" y2="30" stroke="#6B7B8D" stroke-width="1.5" opacity="0.06">
    <animate attributeName="opacity" values="0.06;0.01;0.06" dur="3.4s" repeatCount="indefinite"/>
  </line>
  <line x1="8" y1="46" x2="44" y2="46" stroke="#6B7B8D" stroke-width="1.5" opacity="0.06">
    <animate attributeName="opacity" values="0.06;0.01;0.06" dur="2.8s" repeatCount="indefinite"/>
  </line>
  <line x1="12" y1="62" x2="40" y2="62" stroke="#6B7B8D" stroke-width="1.5" opacity="0.06">
    <animate attributeName="opacity" values="0.06;0.01;0.06" dur="3.2s" repeatCount="indefinite"/>
  </line>

  <!-- TRANSITION zone — wider shimmer -->
  <rect x="60" y="14" width="26" height="16" rx="3" fill="#6B7B8D" opacity="0.1">
    <animate attributeName="opacity" values="0.1;0.03;0.1" dur="3.5s" repeatCount="indefinite"/>
  </rect>
  <rect x="64" y="34" width="22" height="14" rx="3" fill="#6B7B8D" opacity="0.09">
    <animate attributeName="opacity" values="0.09;0.02;0.09" dur="3.8s" repeatCount="indefinite"/>
  </rect>
  <rect x="58" y="50" width="28" height="12" rx="3" fill="#6B7B8D" opacity="0.08">
    <animate attributeName="opacity" values="0.08;0.02;0.08" dur="3.3s" repeatCount="indefinite"/>
  </rect>
  <circle cx="72" cy="26" r="5" fill="#6B7B8D" opacity="0.1">
    <animate attributeName="opacity" values="0.1;0.03;0.1" dur="3.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="68" cy="48" r="4" fill="#6B7B8D" opacity="0.09">
    <animate attributeName="opacity" values="0.09;0.02;0.09" dur="3.1s" repeatCount="indefinite"/>
  </circle>

  <!-- RIGHT: Sharp frame — fades in with subtle solidity -->
  <rect x="104" y="6" width="68" height="68" rx="4" fill="#FFFFFF" stroke="#1E3328" stroke-width="1.8" opacity="0">
    <animate attributeName="opacity" values="0;0.6" dur="1.2s" fill="freeze" begin="0.8s"/>
  </rect>
  <rect x="112" y="14" width="52" height="28" rx="2" fill="#F5F2EB" stroke="#E8DFD6" stroke-width="0.8" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.8s" fill="freeze" begin="1.2s"/>
  </rect>
  <circle cx="130" cy="25" r="6" fill="#C67C5A" opacity="0">
    <animate attributeName="opacity" values="0;0.25" dur="0.6s" fill="freeze" begin="1.4s"/>
  </circle>
  <rect x="140" y="20" width="18" height="3" rx="1" fill="#1E3328" opacity="0">
    <animate attributeName="opacity" values="0;0.3" dur="0.5s" fill="freeze" begin="1.5s"/>
  </rect>
  <rect x="140" y="26" width="14" height="2" rx="1" fill="#1E3328" opacity="0">
    <animate attributeName="opacity" values="0;0.15" dur="0.5s" fill="freeze" begin="1.6s"/>
  </rect>
  <rect x="112" y="48" width="42" height="3.5" rx="1.5" fill="#0a0a0a" opacity="0">
    <animate attributeName="opacity" values="0;0.5" dur="0.5s" fill="freeze" begin="1.7s"/>
  </rect>
  <rect x="112" y="55" width="48" height="2.5" rx="1" fill="#666" opacity="0">
    <animate attributeName="opacity" values="0;0.2" dur="0.5s" fill="freeze" begin="1.8s"/>
  </rect>
  <rect x="112" y="61" width="36" height="2.5" rx="1" fill="#666" opacity="0">
    <animate attributeName="opacity" values="0;0.2" dur="0.5s" fill="freeze" begin="1.9s"/>
  </rect>

  <!-- Gold lock — prominent pulse -->
  <circle cx="172" cy="6" r="4" fill="#D4A853" opacity="0">
    <animate attributeName="opacity" values="0;0.75" dur="0.4s" fill="freeze" begin="2.2s"/>
    <animate attributeName="r" values="4;5.5;4" dur="2.5s" repeatCount="indefinite" begin="2.6s"/>
    <animate attributeName="opacity" values="0.75;0.4;0.75" dur="2.5s" repeatCount="indefinite" begin="2.6s"/>
  </circle>

  <!-- Signal line beneath — draws itself left to right -->
  <path d="M8,88 Q14,82 20,90 Q26,80 32,88 Q38,84 44,92 Q50,86 56,88 Q62,85 68,88 Q76,86 84,87 Q92,84 100,86 Q110,85 120,84 Q130,80 138,76 Q142,82 146,86 Q154,85 162,84 Q170,85 178,84" stroke="#1E3328" stroke-width="1.8" opacity="0.3" stroke-dasharray="300" stroke-dashoffset="300">
    <animate attributeName="stroke-dashoffset" values="300;0" dur="2.5s" fill="freeze" begin="0.3s"/>
  </path>

  <!-- Gold pulse on signal peak — larger radius swing -->
  <circle cx="138" cy="76" r="3" fill="#D4A853" opacity="0">
    <animate attributeName="opacity" values="0;0.6" dur="0.3s" fill="freeze" begin="1.8s"/>
    <animate attributeName="r" values="3;5;3" dur="2s" repeatCount="indefinite" begin="2.1s"/>
    <animate attributeName="opacity" values="0.6;0.3;0.6" dur="2s" repeatCount="indefinite" begin="2.1s"/>
  </circle>
  <!-- Dashed connector from signal to card -->
  <line x1="138" y1="76" x2="138" y2="68" stroke="#C67C5A" stroke-width="1" opacity="0" stroke-dasharray="2 2">
    <animate attributeName="opacity" values="0;0.15" dur="0.3s" fill="freeze" begin="2s"/>
  </line>
</svg>
