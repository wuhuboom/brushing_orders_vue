<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title></title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
  <!-- 直接加载 config.js，确保在 main.js 前可用 -->
  <!-- 动态加载 config.js，带时间戳 -->
  <script>
    function loadConfig(callback) {
      const script = document.createElement('script');
      script.src = '/config.js?t=' + Date.now(); // 防缓存
      script.onload = () => {
        // console.log('config.js 已加载', window.APP_CONFIG);
        callback && callback();
      };
      script.onerror = () => {
        // console.error('config.js 加载失败');
        callback && callback();
      };
      document.head.appendChild(script);
    }

    // 先加载 config.js，再加载 main.js
    loadConfig(() => {
      const mainScript = document.createElement('script');
      mainScript.src = '/src/main.js';
      mainScript.type = 'module';  // ✅ 关键：告诉浏览器这是 ES Module
      document.head.appendChild(mainScript);
      document.title = window.g.VITE_TITLE || '';
    });
  </script>

  <!-- <script>
    document.title = window.g.VITE_TITLE || '';
  </script> -->
</html>
